  <title>Instruções</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      padding: 40px;
      overflow: auto;
      background: var(--bg);
      color: var(--ink);
    }
    .instrucoes-container {
      margin: 0 auto;
      background: rgba(10, 16, 25, 0.8);
      border: 1px solid var(--accent);
      border-radius: 0px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      max-width: 600px;
      width: 100%;
    }
    .instrucoes-container h1 {
      color: var(--accent-neon);
      margin-top: 0;
      text-shadow: 0 0 10px rgba(255, 251, 0, 0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }
    .topic-link {
      display: block;
      margin: 20px 0;
      padding: 20px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      border-left: 4px solid var(--accent);
    }
    .topic-link:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transform: translateY(-2px);
      border-left-color: var(--accent-neon);
      color: var(--accent-neon);
    }
