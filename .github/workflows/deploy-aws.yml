name: Deploy AWS

# Publica o site (S3 + CloudFront) e a API (Lambda + API Gateway) em omniailab.com.br.
# Credenciais temporárias via OIDC: nenhuma chave da AWS fica guardada no GitHub.
# Variáveis do repositório (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN, HOSTED_ZONE_ID, ARTIFACT_BUCKET  (saídas do stack omniailab-bootstrap)
#   ALERT_EMAIL (opcional)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "site_publico/**"
      - "site_data/**"
      - "index.html"
      - "infra/aws/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1

jobs:
  deploy:
    name: Infra, API e site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Gera o índice público e o pacote do Lambda
        run: |
          pip install -r requirements-api.txt
          python -m api.indice
          bash infra/aws/build_lambda.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Certificado, stack da aplicação, site e smoke test
        env:
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: bash infra/aws/deploy.sh
