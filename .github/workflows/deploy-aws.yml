name: Deploy AWS

# Publica o site (S3 + CloudFront) e a API (Lambda + API Gateway) em omniailab.com.br.
# Credenciais temporárias via OIDC: nenhuma chave da AWS fica guardada no GitHub.
# Variáveis do repositório (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN, HOSTED_ZONE_ID, ARTIFACT_BUCKET  (saídas do stack omniailab-bootstrap)
#   ALERT_EMAIL (opcional)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "site_publico/**"
      - "site_data/**"
      - "index.html"
      - "infra/aws/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  DOMAIN: omniailab.com.br

jobs:
  deploy:
    name: Infra, API e site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Gera o índice público e o pacote do Lambda
        run: |
          pip install -r requirements-api.txt
          python -m api.indice
          bash infra/aws/build_lambda.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Certificado TLS (us-east-1)
        id: cert
        run: |
          aws cloudformation deploy --region us-east-1 \
            --stack-name omniailab-certificado \
            --template-file infra/aws/certificado.yaml \
            --parameter-overrides DomainName=$DOMAIN HostedZoneId=${{ vars.HOSTED_ZONE_ID }} \
            --no-fail-on-empty-changeset
          arn=$(aws cloudformation describe-stacks --region us-east-1 --stack-name omniailab-certificado \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Stack do site e da API (sa-east-1)
        id: app
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          aws cloudformation package \
            --template-file infra/aws/template.yaml \
            --s3-bucket ${{ vars.ARTIFACT_BUCKET }} --s3-prefix lambda \
            --output-template-file build/packaged.yaml
          aws cloudformation deploy \
            --stack-name omniailab-app \
            --template-file build/packaged.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides DomainName=$DOMAIN HostedZoneId=${{ vars.HOSTED_ZONE_ID }} \
              CertificateArn=${{ steps.cert.outputs.arn }} ${ALERT_EMAIL:+AlertEmail=$ALERT_EMAIL} \
            --no-fail-on-empty-changeset
          saida() { aws cloudformation describe-stacks --stack-name omniailab-app \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(saida SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(saida DistributionId)" >> "$GITHUB_OUTPUT"

      - name: Envia o site para o S3
        env:
          BUCKET: ${{ steps.app.outputs.bucket }}
        run: |
          # Acervos grandes vão já comprimidos: o CloudFront só comprime arquivos de até 10 MB.
          mkdir -p build/site_data
          cp -r site_data/. build/site_data/
          find build/site_data -type f \( -name "*.jsonl" -o -name "*.json" -o -name "*.bin" \) -exec gzip -9 -n {} \; -exec sh -c 'mv "$1.gz" "$1"' _ {} \;
          aws s3 sync build/site_data/ s3://$BUCKET/site_data/ --delete \
            --content-encoding gzip --cache-control "public, max-age=3600" \
            --exclude "*" --include "*.jsonl" --include "*.json" --include "*.bin"
          aws s3 sync build/site_data/ s3://$BUCKET/site_data/ --delete \
            --cache-control "public, max-age=3600" \
            --exclude "*.jsonl" --exclude "*.json" --exclude "*.bin"
          aws s3 sync site_publico/ s3://$BUCKET/site_publico/ --delete \
            --cache-control "public, max-age=300" --exclude "Autos/*.pdf"
          aws s3 cp index.html s3://$BUCKET/index.html --cache-control "public, max-age=300"

      - name: Limpa o cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.app.outputs.distribution }} --paths "/*" >/dev/null

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$DOMAIN/health"; then break; fi
            sleep 20
          done
          curl -fsS "https://$DOMAIN/health" | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "https://$DOMAIN/site_publico/"
          curl -fsS "https://$DOMAIN/api/search?q=alvar%C3%A1&limit=1" | grep -q '"total"'
