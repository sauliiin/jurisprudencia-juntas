name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest
    permissions:
      contents: write # só para publicar o badge de cobertura no branch "badges"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt

      - name: Instala dependências da API e dos testes
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Pytest com cobertura
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=json

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          total = json.load(open("coverage.json"))["totals"]
          print(f"### Cobertura do pacote api/: {total['percent_covered']:.1f}%")
          print(f"{total['covered_lines']} de {total['num_statements']} linhas cobertas.")
          PY
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore

      - name: Publica o badge de cobertura
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          if [ "$pct" -ge 90 ]; then cor=brightgreen; elif [ "$pct" -ge 80 ]; then cor=green; else cor=orange; fi
          mkdir -p "$RUNNER_TEMP/badges" && cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"cobertura","message":"%s%%","color":"%s"}\n' "$pct" "$cor" > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Badge de cobertura: ${pct}%"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  docker:
    name: Build e smoke test da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        run: docker compose build

      - name: Sobe com docker compose e espera o health check
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS "http://localhost:8000/api/search?q=obra%20sem%20alvar%C3%A1&limit=1" | python3 -c \
            "import json, sys; d = json.load(sys.stdin); assert d['total'] > 0, d; print('resultados:', d['total'])"
          curl -fsS -o /dev/null http://localhost:8000/site_publico/

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derruba os contêineres
        if: always()
        run: docker compose down -v
