[project]
name = "omniai-jurisprudencia"
version = "1.0.0"
description = "Busca de decisões administrativas das Juntas de Belo Horizonte, com API FastAPI e IA no navegador."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Saulo Hugo Rossi" }]
# Dependências em requirements-api.txt (API), requirements-dev.txt (testes e lint) e
# requirements.txt (pipeline), para o Docker e a CI instalarem só o que usam.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["site_publico", "site_data", "votos_brutos", "pareceres_brutos", "legislacao_brutos"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
# RUF001-003: o texto em português usa "–", "·" e "º" de propósito.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["api"]
omit = ["api/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
